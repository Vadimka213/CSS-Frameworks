<!DOCTYPE html>
<html lang="uk">
<head>

    </div>
    <div class="col-12 col-md-4">
      <div class="card p-3">
        <h3>Картка 2</h3>
        <p>Опис другої картки.</p>

      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card p-3">
        <h3>Картка 3</h3>
        <p>Опис третьої картки.</p>

    </div>

</html>
