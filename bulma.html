
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <title>Bulma</title>
</head>
<body class="section">

  <h1 class="title has-text-centered">Наші картки</h1>
  <div class="columns is-multiline">
    <div class="column is-full-mobile is-one-third-tablet">
      <div class="box">
        <h2 class="title is-4">Картка 1</h2>
        <p class="mb-3">Опис першої картки.</p>
        <button class="button is-link">Детальніше</button>
      </div>
    </div>
    <div class="column is-full-mobile is-one-third-tablet">
      <div class="box">
        <h2 class="title is-4">Картка 2</h2>
        <p class="mb-3">Опис другої картки.</p>
        <button class="button is-success">Детальніше</button>
      </div>
    </div>
    <div class="column is-full-mobile is-one-third-tablet">
      <div class="box">
        <h2 class="title is-4">Картка 3</h2>
        <p class="mb-3">Опис третьої картки.</p>
        <button class="button is-dark">Детальніше</button>
      </div>
    </div>
  </div>

</body>
</html>
