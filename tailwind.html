
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Tailwind</title>
</head>
<body class="bg-gray-100 p-8">

  <h1 class="text-center text-3xl font-bold mb-6">Наші картки</h1>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-xl font-bold">Картка 1</h2>
      <p class="my-3">Опис першої картки.</p>
      <button class="bg-blue-600 text-white p-2 rounded">Детальніше</button>
    </div>
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-xl font-bold">Картка 2</h2>
      <p class="my-3">Опис другої картки.</p>
      <button class="bg-green-600 text-white p-2 rounded">Детальніше</button>
    </div>
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-xl font-bold">Картка 3</h2>
      <p class="my-3">Опис третьої картки.</p>
      <button class="bg-gray-800 text-white p-2 rounded">Детальніше</button>
    </div>
  </div>

</body>
</html>
